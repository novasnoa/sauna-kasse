<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8a4b1f">

<title>Olivin</title>
<style>
/* Warum eine einzige Datei: läuft offline auf Tablet/PC, kein Server, keine Installation.
   Warum Beträge in Cent: Gleitkomma-Summen würden bei Abrechnungen um Cent-Bruchteile abweichen. */
:root{--bg:#f4f1ec;--card:#fff;--ink:#222;--mut:#777;--acc:#8a4b1f;--ok:#2f7d4f;--warn:#b3361f;--line:#ddd5ca}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
/* Touch: Bedienflächen mindestens ~48 px, kein Doppeltipp-Zoom, Schrift ≥16 px (sonst zoomt iOS beim Tippen ins Feld). */
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0 16px 0 0}
header button{background:transparent;color:#fff;border:1px solid #ffffff80;padding:10px 18px;border-radius:8px;font-size:17px}
header button.on{background:#fff;color:var(--acc)}
header h1{cursor:pointer;user-select:none;-webkit-user-select:none}
header button.lnk{border:none;text-decoration:underline;padding:10px 8px}
header button.lnk.on{background:transparent;color:#fff;font-weight:700}
#nav{display:flex;gap:4px;flex-wrap:wrap}
#re{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Langer Name darf die Zeile nicht sprengen: abschneiden, die ganze Zeile steht in der Liste darunter. */
main{max-width:1280px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left))}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0}
h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:12px 0 4px}
button,select,input{font:inherit;padding:10px 12px;min-height:48px;border-radius:8px;border:1px solid var(--line);background:#fff}
button{cursor:pointer;user-select:none;-webkit-user-select:none}
button:active{filter:brightness(.9)}
input[type=checkbox]{min-height:0;width:28px;height:28px}
label{display:inline-flex;align-items:center;gap:8px;min-height:48px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border-radius:24px}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tip button{min-width:64px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.x{color:var(--warn);min-width:48px;font-size:20px;padding:4px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.tabs button.on{background:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.grid button{text-align:left;padding:12px;min-height:76px;font-size:17px}
.grid small{display:block;color:var(--mut)}
.grid button.mass{border-left:4px solid var(--acc)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.warn{color:var(--warn);font-weight:600}.good{color:var(--ok);font-weight:600}
.chip{padding:10px 18px;border-radius:26px;font-size:17px}
.chip.key{min-width:76px;font-size:20px;font-weight:600}
@media(min-width:900px){.zwei{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}}
.chip.on{background:var(--acc);color:#fff}
/* Kopfzeile der Gastkarte: Schlüssel, die Masseure der Schicht und „Gast geht“ haben dieselbe Form (Höhe, Rundung,
   Schrift). Die Masseure sind nur durch den hellen Grund leicht abgesetzt; die Schaltfläche bleibt ein Knopf. */
.k4row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 6px}
.k4{display:inline-flex;align-items:center;min-height:44px;height:44px;padding:0 18px;margin:0;border-radius:22px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:17px;font-weight:600;line-height:1;white-space:nowrap}
.k4.mt{background:#f5eee6;color:var(--acc);font-weight:500}
button.k4.mt{cursor:pointer;font-weight:600}
.k4.mt.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.k4.go{margin-left:auto}
/* Die beiden Buchungsblöcke (Sauna, Massage) liegen unter den Kacheln nebeneinander, darunter die Liste */
.zblocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin:8px 0 0}
.zblocks .zblock{margin:0}
.stat{font-size:13px;font-weight:600;white-space:nowrap}
.stat.off{color:var(--warn)}.stat.bez{color:var(--ok)}
tr.zoffen td{background:#fdf3f1}
/* Hauptseite: oben die Kacheln der drei Rubriken nebeneinander, darunter die Abrechnung des Gastes */
.rubriken{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2px 18px;align-items:start;margin-bottom:6px}
.grid.kach{grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px}
.grid button.kachel{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;min-height:132px;padding:12px 8px;font-size:18px;line-height:1.15}
.kachel .kn{word-break:break-word;font-weight:500}
.kachel small{margin-top:1px;font-size:14px}
.kachel .st{font-size:12px;font-weight:600}
/* Stand für den gewählten Gast: Zähler oben rechts; Farbe: offen rot, teilweise bezahlt gelb, bezahlt grün */
.kachel .zahl{position:absolute;top:6px;right:6px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--warn);color:#fff;font-size:15px;font-weight:700;line-height:26px}
.kachel.offen{background:#fde8e4;border-color:var(--warn)}.kachel.offen .st{color:var(--warn)}
.kachel.teil{background:#fbf0dc;border-color:#b7791f}.kachel.teil .zahl{background:#b7791f}.kachel.teil .st{color:#8a5a12}
.kachel.bezahlt{background:#e6f3ea;border-color:var(--ok)}.kachel.bezahlt .zahl{background:var(--ok)}.kachel.bezahlt .st{color:var(--ok)}
.kachel.l .ic{color:#8a4b1f}.kachel.m .ic{color:#0F6E56}.kachel.w .ic{color:#5F5E5A}
.ic{flex:none}
.symgr h3{margin:12px 0 4px}
.symraster{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.symraster .symb{min-height:48px;height:48px;padding:0;display:flex;align-items:center;justify-content:center;color:#8a4b1f}
.symraster .symb.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.modal .card.sym{width:min(780px,100%)}
.kachel.m{border-left-color:#0F6E56}
.symb[hidden],.symgr[hidden]{display:none!important}
.k4.vl{background:#fde8e4;color:var(--warn);border-color:var(--warn)}
.gross{margin:10px 0 2px;padding:8px 12px;border:2px solid var(--acc);border-radius:10px;background:#fff;text-align:center}
.grossbetrag{font-size:46px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--acc)}
.vermerk{margin-top:14px;padding:8px 12px;border:1px dashed var(--line);border-radius:8px;background:#fcfaf7;font-size:15px}
.zblock{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:10px 0;background:#fcfaf7}
.k4.timer{font-variant-numeric:tabular-nums;font-weight:600}
.chip .rest{font-variant-numeric:tabular-nums;font-size:.85em;margin-left:6px;opacity:.9}
.chip .rest.ueber{font-weight:700;opacity:1}
.chip .umsatz{font-size:.85em;margin-left:6px;opacity:.9}
.k4.timer.ueber{background:var(--warn);color:#fff;border-color:var(--warn)}
.chip.rot{background:var(--warn);color:#fff;border-color:var(--warn)}
.nachzahlung{background:#fde8e4;border:2px solid var(--warn);color:var(--warn);font-weight:600;border-radius:8px;padding:8px 12px;margin:8px 0}
.sum{font-size:17px;display:flex;gap:20px;flex-wrap:wrap;margin:8px 0}
#gl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Alle Elemente der Leiste im Kopf haben dieselbe Form: gleich hoch, gleich rund, gleiche Schrift. Die drei Schalter
   „N aktiv“, „N gegangen“ und „＋ neu“ sind außerdem gleich breit; der Schichten-Schalter folgt mit etwas Abstand. */
#gl > :not(#pop){display:inline-block;box-sizing:border-box;height:44px;min-height:44px;line-height:42px;padding:0 16px;margin:0;border-radius:22px;font-size:16px;white-space:nowrap}
#gl > :not(#pop).gruppe{display:inline-flex;align-items:center;padding:0;overflow:hidden;line-height:normal;border:1px solid #ffffff80}
#gl .gtitel{padding:0 12px 0 14px;font-size:15px;font-weight:600;opacity:.9;white-space:nowrap}
#gl .gruppe > button{box-sizing:border-box;height:42px;min-height:42px;padding:0 10px;margin:0;border:none;border-left:1px solid #ffffff59;border-radius:0;font-size:16px;line-height:1;white-space:nowrap;color:#fff}
/* Drei leise Farbtöne auf dem braunen Kopf: aktiv grünlich, gegangen gedämpft, neu hell-warm. Geöffnet wird der Knopf weiß. */
#gl .gruppe > .g-aktiv{background:rgba(47,125,79,.55)}
#gl .gruppe > .g-weg{background:rgba(255,255,255,.10)}
#gl .gruppe > .g-neu{background:rgba(255,214,150,.30)}
#gl .gruppe > button.on{background:#fff;color:var(--acc)}
#gl > :not(#pop).sch{margin-left:14px}   /* etwas Abstand zwischen den drei Schaltern und der Schichtenanzeige */
#pop{position:absolute;top:100%;left:8px;right:8px;background:var(--card);color:var(--ink);border:2px solid var(--acc);border-radius:8px;padding:8px 12px;box-shadow:0 6px 18px #0004;max-height:60vh;overflow:auto}
#pop button{background:#fff;color:var(--ink);border:1px solid var(--line)}
#pop button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#pop button.rot{background:var(--warn);color:#fff;border-color:var(--warn)}
/* Schlüsselfarbe nach Zahlstand (zahlKlasse): offen rot, bezahlt grün. Der gewählte Gast behält seine Farbe und bekommt einen Ring. */
.k4.offen,.chip.offen,#pop button.chip.offen{background:var(--warn);color:#fff;border-color:var(--warn)}
.k4.bezahlt,.chip.bezahlt,#pop button.chip.bezahlt{background:var(--ok);color:#fff;border-color:var(--ok)}
.chip.on.offen,.chip.on.bezahlt,#pop button.chip.on.offen,#pop button.chip.on.bezahlt{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--acc)}
.chip.rot.bezahlt,#pop button.chip.rot.bezahlt{background:var(--warn);border-color:var(--warn)}   /* über vier Stunden im Haus bleibt rot, auch wenn bezahlt */
/* Querformat (Tablet): alles in einer Zeile – etwas engere Knöpfe, damit Olivin, Gästeleiste und Verweise nebeneinander
   passen. Steht bewusst NACH den Grundregeln von #gl, #re und #nav: gleiche Gewichtung, die spätere gewinnt. */
@media(min-width:980px){
  header{flex-wrap:nowrap;gap:6px}
  header h1{margin-right:8px}
  header button{padding:10px 12px;font-size:16px;white-space:nowrap;flex:0 0 auto}
  header button.lnk{padding:10px 8px}
  #gl,#re,#nav{flex-wrap:nowrap;gap:6px}
  #gl{min-width:0}   /* sonst kann der lange Gastname nie schrumpfen, weil #gl nicht unter seine Inhaltsbreite darf */
  #gl > :not(#pop){padding:0 14px}
  #gl > :not(#pop).gruppe{padding:0}
  #gl .gruppe > button{width:122px;padding:0}   /* Querformat: alle drei gleich breit; schmal: so breit wie der Text */
}
.modal{position:fixed;inset:0;z-index:20;background:#0006;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px;overflow:auto}
.modal .card{width:min(560px,100%);margin:0;border:2px solid var(--acc);box-shadow:0 8px 28px #0005}
.noprint{}
.printonly{display:none}
@media print{
  .seite{break-after:page}
  header,.noprint{display:none!important}
  body{background:#fff}.card{border:none;padding:0;break-inside:avoid}
  .printonly{display:block}main{max-width:none;padding:0}
}
</style>

<body>
<header class="noprint">
  <h1 data-act="tab" data-v="kasse" title="Zur Kasse">Olivin</h1>
  <span id="gl"></span>
  <span id="re">
  <span id="nav"></span>
  <button id="wolke" hidden class="noprint"></button>
  <span id="netz" hidden style="background:#fff;color:var(--warn);font-weight:600;border-radius:20px;padding:6px 14px">● Offline – alles läuft lokal weiter</span></span>
</header>
<main id="app"></main>

<script>
'use strict';
const KEY = 'saunakasse-v1';
let S = laden();
// UI-Zustand, wird nicht gespeichert
// Der Eintritt gilt 4 Stunden; danach wird der Schlüssel rot und der Gast muss nachzahlen.
const LIMIT_MS = 4 * 3600 * 1000;
// Miete: Die Masseure verkaufen ihre Massagen selbst und mieten dafür die Sauna. Für jede Massage zählen 30 % des Preises
// (ohne Trinkgeld) als Saunaeinnahme. Die Masseure bezahlen die Miete später per Rechnung – in ihrer Abrechnung steht sie
// nur als Vermerk und wird nicht von der Auszahlung abgezogen. Gerechnet wird je Buchungszeile und gerundet auf Cent.
const MIETE_PROZENT = 30;
const miete = b => Math.round(b.preis * b.menge * MIETE_PROZENT / 100);
const U = { symZiel: null, neuIcon: {}, editIcon: '', art: 'Karte', oeffnen: false, extra: false, extraSel: [], neu: false, pop: null, gastZu: false, edit: null, keep: null, form: null, tab: 'kasse', sch: null, gast: null, mas: '', abr: null, fuer: 'ges', st: 'ma' };

function laden() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return migriere(s); } catch (e) {}
  return { v: 1, ma: [], mas: [], lei: [], war: [], kun: [], sch: [], tot: {} };
}
// Warum: früher war ein „Gast“ nur die Kunden-ID. Jetzt ist jeder Aufenthalt ein eigener Satz,
// damit dieselbe Schlüsselnummer am Abend mehrfach vergeben werden kann, ohne dass sich
// die Buchungen der Gäste vermischen. Die alte Kunden-ID wird zur Gast-ID, damit
// bestehende Buchungen und Zahlungen weiter passen.
function migriere(s) {
  s.sch.forEach(x => { x.gaeste = x.gaeste.map(g => typeof g === 'string' ? { id: g, kun: g, name: '', da: !x.zu, an: '', ab: '' } : g); });
  s.tot = s.tot || {};   // Löschvermerke für den Abgleich (Id → Zeitpunkt)
  return s;
}
function speichern() {
  stempeln();
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { alert('Speichern im Browser nicht möglich – bitte „Sicherung“ herunterladen!'); }
  if (G.an) gPlan();
}
const id = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const eur = c => (c / 100).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
function cent(txt) {
  const n = parseFloat(String(txt).replace(/\./g, '').replace(',', '.'));
  return isFinite(n) ? Math.round(n * 100) : 0;
}
const heute = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const datumDe = d => d.split('-').reverse().join('.');
const uhr = () => new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const $ = i => document.getElementById(i);
const aktive = k => S[k].filter(x => !x.weg);
const name = (k, i) => (S[k].find(x => x.id === i) || { name: '(gelöscht)' }).name;
const $v = i => ($(i) || {}).value || '';

// Reine Bedienungs-Umschalter (Zahlart, Empfänger …) zeichnen neu; angefangene Eingaben bleiben dabei stehen.
const behalte = () => { U.keep = {}; ['p-s-betrag', 'p-s-tip', 'p-m-betrag', 'p-m-tip', 'x-betrag', 'g-nr', 'g-name', 's-srv-name', 's-srv-preis', 's-mss-name', 's-mss-preis', 's-war-name', 's-war-preis', 'e-name', 'e-preis'].forEach(i => { U.keep[i] = $v(i); }); };
// Intern bleiben die Schichten 1 und 2 (alte Daten), angezeigt werden sie mit Namen.
const schName = nr => ({ 1: 'Tagesschicht', 2: 'Abendschicht' })[nr] || 'Schicht ' + nr;
const offeneSchichten = () => S.sch.filter(s => !s.zu);
const schicht = () => S.sch.find(s => s.id === U.sch && !s.zu) || offeneSchichten()[0] || null;
// Ein Schlüssel ist belegt, solange ein Gast mit dieser Nummer in irgendeiner offenen Schicht noch da ist.
function belegt(kunId) {
  for (const s of offeneSchichten()) { const g = s.gaeste.find(x => x.kun === kunId && x.da); if (g) return { s, g }; }
  return null;
}
// Trinkgeld „anteilig“: Das Trinkgeld einer Zahlung wird nach dem Anteil verteilt, den die Massagen
// jedes Masseurs an allen Buchungen des Gastes haben; der Rest (Sauna, Waren) geht an den Mitarbeiter
// der Kasse. Gerechnet wird erst in der Abrechnung, damit spätere Korrekturen an den Buchungen
// einfließen. Cent-Reste bekommt der Kassenanteil, bei reiner Massage der größte Masseur –
// so geht kein Cent verloren.
function tipVerteilung(s, z) {
  if (!z.tip) return [];
  // Sonstiges Trinkgeld: gleichmäßig auf die Angewählten; übrige Cent bekommen der Reihe nach die ersten,
  // damit die Summe stimmt und kein Cent verloren geht.
  if (z.tipAn === 'multi') {
    const e = z.empf || [];
    if (!e.length) return [{ an: '', betrag: z.tip }];
    const je = Math.floor(z.tip / e.length), rest = z.tip - je * e.length;
    return e.map((an, i) => ({ an, betrag: je + (i < rest ? 1 : 0) }));
  }
  if (z.tipAn !== 'auto') return [{ an: z.tipAn, betrag: z.tip }];
  const buch = s.buch.filter(b => b.gast === z.gast);
  const gesamt = buch.reduce((a, b) => a + b.preis * b.menge, 0);
  const je = {};
  buch.filter(b => b.masseur).forEach(b => { je['m:' + b.masseur] = (je['m:' + b.masseur] || 0) + b.preis * b.menge; });
  const kasse = 'p:' + (z.ma || s.ma), mass = Object.values(je).reduce((a, u) => a + u, 0);
  if (gesamt <= 0 || mass <= 0) return [{ an: kasse, betrag: z.tip }];
  const out = Object.entries(je).sort((a, b) => b[1] - a[1]).map(([an, u]) => ({ an, betrag: Math.floor(z.tip * u / gesamt) }));
  const rest = z.tip - out.reduce((a, x) => a + x.betrag, 0);
  if (rest > 0) { if (mass < gesamt) out.push({ an: kasse, betrag: rest }); else out[0].betrag += rest; }
  return out;
}
// „neu“: ohne Übernommenes aus der vorigen Schicht – das ist dort schon abgerechnet. Offen zählt immer alles.
function gastSumme(s, k, neu) {
  const bu = s.buch.filter(b => b.gast === k), za = s.zahl.filter(z => z.gast === k);
  const sum = (a, f) => a.reduce((x, y) => x + f(y), 0);
  const gesamt = sum(bu, b => b.preis * b.menge) - sum(za, z => z.betrag);
  const nb = neu ? bu.filter(b => !b.uebernommen) : bu, nz = neu ? za.filter(z => !z.uebernommen) : za;
  return { soll: sum(nb, b => b.preis * b.menge), bez: sum(nz, z => z.betrag), tip: sum(nz, z => z.tip), offen: gesamt };
}

// Zwei Zahlblöcke je Gast: „Sauna“ (Leistungen und Waren, kassiert der Mitarbeiter am Tresen) und „Massage“ (verkaufen die
// Masseure selbst, der Tresen nimmt nur das Geld). Eine Massage-Buchung trägt ihren Masseur (b.masseur), alles andere
// zählt zur Sauna. Offen wird getrennt gerechnet; Zahlungen ohne kat (früher gebucht) mindern erst die Sauna, den Rest
// die Massagen. „je“ ist der offene Betrag je Masseur.
function offenKat(s, k) {
  const bu = s.buch.filter(b => b.gast === k), za = s.zahl.filter(z => z.gast === k);
  const sum = (a, f) => a.reduce((x, y) => x + f(y), 0), wert = b => b.preis * b.menge;
  const sauna = sum(bu.filter(b => !b.masseur), wert), massage = sum(bu.filter(b => b.masseur), wert);
  const alt = sum(za.filter(z => !z.kat), z => z.betrag);
  let offS = sauna - sum(za.filter(z => z.kat === 'sauna'), z => z.betrag), offM = massage - sum(za.filter(z => z.kat === 'massage'), z => z.betrag);
  const ausS = Math.min(alt, Math.max(0, offS)); offS -= ausS; offM -= alt - ausS;
  const je = {};
  bu.filter(b => b.masseur).forEach(b => { je[b.masseur] = (je[b.masseur] || 0) + wert(b); });
  za.filter(z => z.kat === 'massage' && z.masseur).forEach(z => { je[z.masseur] = (je[z.masseur] || 0) - z.betrag; });

// Symbol je Leistung/Massage/Ware: ein in den Stammdaten gewähltes (icon) geht vor, sonst wird es nach Stichwörtern im Namen
// bestimmt, sonst gilt das Standardsymbol der Rubrik. Die Zuordnung der ersten Stichwörter stammt von Robert (10.10.2026).
const symNorm = n => String(n || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const SYMBOL_STICH = [
  [/erm|ermass/, 'discount'], [/eintritt/, 'door-enter'], [/kind/, 'mood-kid'], [/spat|abend|nacht/, 'moon-stars'],
  [/verlang/, 'clock-plus'], [/mantel/, 'hanger-2'], [/tuch/, 'stack-2'], [/schuh|sandale|latsche/, 'shoe'],
  [/cola|limo|flasche/, 'bottle'], [/saft/, 'glass-full'], [/wasser/, 'droplet'], [/bier/, 'beer']];
function symbolFuer(l, k) {
  if (l.icon && ICONS[l.icon]) return l.icon;
  if (l.massage) return 'massage';
  const n = symNorm(l.name), r = SYMBOL_STICH.find(([re]) => re.test(n));
  return r && ICONS[r[1]] ? r[1] : (k === 'war' ? 'shopping-bag' : 'tag');

// Bezahlt je Buchungszeile eines Gastes: Die Zahlungen decken die Zeilen der Reihe nach (älteste zuerst) – Sauna-Zahlungen die
// Zeilen ohne Masseur, Massage-Zahlungen die Zeilen des jeweiligen Masseurs. Zahlungen ohne kat (früher gebucht) füllen danach
// zuerst offene Sauna-, dann Massagezeilen. Rein zur Anzeige auf den Kacheln; Summen und Offen rechnet weiter gastSumme/offenKat.
function zahlVerteilung(s, k) {
  const bu = s.buch.filter(b => b.gast === k), za = s.zahl.filter(z => z.gast === k), bez = {};
  const wert = b => b.preis * b.menge, rest = b => wert(b) - (bez[b.id] || 0), summe = (a, f) => a.reduce((x, y) => x + f(y), 0);
  const fuell = (zeilen, topf) => zeilen.forEach(b => { const x = Math.max(0, Math.min(topf.v, rest(b))); bez[b.id] = (bez[b.id] || 0) + x; topf.v -= x; });
  const sauna = bu.filter(b => !b.masseur), mass = bu.filter(b => b.masseur);
  fuell(sauna, { v: summe(za.filter(z => z.kat === 'sauna'), z => z.betrag) });
  [...new Set(mass.map(b => b.masseur))].forEach(m => fuell(mass.filter(b => b.masseur === m), { v: summe(za.filter(z => z.kat === 'massage' && z.masseur === m), z => z.betrag) }));
  const alt = { v: summe(za.filter(z => !z.kat), z => z.betrag) };
  fuell(sauna, alt); fuell(mass, alt);
  return bez;
}
// Stand einer Kachel für diesen Gast: wie oft gebucht (n), wie viel davon bezahlt, und der Gesamtzustand
function kachelStand(buch, bez, l, massage) {
  const z = buch.filter(b => b.name === l.name && !!b.masseur === !!massage);
  const n = z.reduce((a, b) => a + b.menge, 0); if (!n) return null;
  const wert = z.reduce((a, b) => a + b.preis * b.menge, 0), bezahlt = z.reduce((a, b) => a + (bez[b.id] || 0), 0);
  const einheiten = Math.min(n, Math.floor(bezahlt / (wert / n) + 1e-9));
  return { n, einheiten, stand: bezahlt >= wert ? 'bezahlt' : bezahlt > 0 ? 'teil' : 'offen' };
}

// 4-Stunden-Uhr je Gast in der Kopfzeile seiner Karte: läuft von 4:00:00 herunter, danach zählt sie die Überzeit
// („+0:12:05“, rot) – dann ist die Nachzahlung fällig. Wie markiere() ändert sie nur Text und Klasse, ohne neu zu
// zeichnen, damit angefangene Eingaben stehen bleiben.
function uhrText(ts) {
  const rest = LIMIT_MS - (Date.now() - ts), a = Math.abs(rest), z = n => String(n).padStart(2, '0');
  const t = `${Math.floor(a / 3600000)}:${z(Math.floor(a / 60000) % 60)}:${z(Math.floor(a / 1000) % 60)}`;
  return rest > 0 ? t : '+' + t;
}
function uhrenAktualisieren() {
  document.querySelectorAll('.timer[data-ts], .rest[data-ts]').forEach(e => {
    e.textContent = '⏱ ' + uhrText(+e.dataset.ts);

}

// Verlängerung: Der Eintritt gilt 4 Stunden (LIMIT_MS). Für jede angebrochene Stunde danach bucht die Kasse selbst
// 1× „Verlängerung“ auf den Gast – die erste Minute nach 4:00 zählt schon als erste Stunde. Preis und Name kommen aus
// der Leistung „Verlängerung“ in den Stammdaten (Services); ohne sie bucht die Kasse nichts und zeigt einen Hinweis.
// Die Buchung hat eine feste Id je Gast („vl-<Gast>“): zwei Geräte rechnen dasselbe und legen so keine Doppelten an.
// Was in der Vorschicht schon berechnet wurde (übernommene Zeilen), wird abgezogen; nimmt jemand per ✕ eine Einheit
// weg, merkt sich der Gast das (vlAbzug), sonst käme sie beim nächsten Takt wieder.
// Erkennung großzügig: Groß/Klein, ä/ae/a (auch zerlegtes ä vom Tablet), Zusätze wie „Verlängerung 1 Std.“ oder
// „Stunden-Verlängerung“. Gesucht wird in den Services, danach in den Waren; die genaue Schreibweise „Verlängerung“ geht vor.
const vlNorm = n => String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/ae/g, 'a').replace(/\s+/g, ' ').trim();
const vlName = n => vlNorm(n).includes('verlangerung');
const vlItem = () => {
  const alle = [...aktive('lei').filter(l => !l.massage), ...aktive('war')].filter(l => vlName(l.name));
  return alle.find(l => vlNorm(l.name) === 'verlangerung') || alle[0];
};
const vlStunden = (g, bis) => { const u = (bis || Date.now()) - g.ts - LIMIT_MS; return u > 0 ? Math.ceil(u / 3600000) : 0; };
function vlFuerGast(s, g, l) {
  if (!l || !g.ts) return false;
  const n = vlStunden(g); if (!n) return false;
  const schon = s.buch.filter(b => b.gast === g.id && b.uebernommen && vlName(b.name)).reduce((a, b) => a + b.menge, 0);
  const soll = Math.max(0, n - schon - (g.vlAbzug || 0)); if (!soll) return false;
  const b = s.buch.find(x => x.id === 'vl-' + g.id);
  if (!b) { s.buch.push({ id: 'vl-' + g.id, gast: g.id, name: l.name, preis: l.preis, menge: soll, masseur: '', zeit: uhr(), auto: true }); return true; }
  if (b.menge < soll) { b.menge = soll; b.zeit = uhr(); return true; }
  return false;
}
function verlaengerungenPruefen() {
  const l = vlItem(); if (!l) return false;
  let geaendert = false;
  offeneSchichten().forEach(s => s.gaeste.forEach(g => { if (g.da && vlFuerGast(s, g, l)) geaendert = true; }));
  return geaendert;
}
// Alle 30 Sekunden; mitten in einer Eingabe wird nicht neu gezeichnet (dann beim nächsten Takt).
function vlTakt() {

// Rot färben ohne neu zu zeichnen, damit angefangene Eingaben nicht verloren gehen.

const fp = o => JSON.stringify(Object.fromEntries(Object.entries(o).filter(([k]) => k !== '_t' && !LISTKEYS.includes(k))));

  const m = {};

let BASIS = fingerprints();
// Erkennt bei jedem Speichern, was sich seit dem letzten Mal geändert hat, und stempelt es – so muss keine
// der vielen Stellen im Programm selbst daran denken. Verschwundene Sätze werden als gelöscht vermerkt.
function stempeln() {
  const jetzt = Date.now(), neu = {};
  const geh = o => { const f = fp(o); neu[o.id] = f; if (BASIS[o.id] !== f) o._t = jetzt; };
  for (const c of COLL) for (const r of S[c]) { geh(r); if (c === 'sch') for (const l of LISTKEYS) for (const x of r[l] || []) geh(x); }

function mergeList(a, b, tot) {

// Zwei Geräte haben „Anna“ oder Schlüssel 1 oft unabhängig angelegt (verschiedene Ids): solche Stammdaten
// werden über Name/Nummer als dieselben erkannt und die Verweise der fremden Schichten umgeschrieben.
function zusammenfuehren(lok, rem) {
  rem = JSON.parse(JSON.stringify(rem)); rem.tot = rem.tot || {};
  const nk = (c, r) => c === 'kun' ? String(r.nummer).trim() : (r.name || '').trim().toLowerCase() + (c === 'lei' ? '|' + !!r.massage : '');
  const map = {};
  for (const c of ['ma', 'mas', 'lei', 'war', 'kun']) {

      if (r.weg || lok[c].some(x => x.id === r.id)) return true;
      const g = lok[c].find(x => !x.weg && nk(c, x) === nk(c, r));
      if (g) { map[r.id] = g.id; return false; }

    });

  for (const r of rem.sch) {   // dieselbe Schicht (Tag + Art), unabhängig auf zwei Geräten geöffnet
    const g = lok.sch.find(x => x.datum === r.datum && x.nr === r.nr && x.id !== r.id);
    if (g && !rem.sch.some(y => y.id === g.id)) r.id = g.id;

  for (const s of rem.sch) {

      .forEach(s => opt.push([s.id, `${datumDe(d)} – ${schName(s.nr)}${s.zu ? '' : ' (offen)'}`]));
  });
  return opt;
}
function vAbr() {
  const opt = abrAuswahl();
  if (!opt.length) return `<div class="card">Noch keine Schichten vorhanden.</div>`;
  if (!opt.find(o => o[0] === U.abr)) U.abr = opt[0][0];
  const sch = U.abr.startsWith('tag:') ? S.sch.filter(s => s.datum === U.abr.slice(4)) : S.sch.filter(s => s.id === U.abr);
  // Masseure, die in den gewählten Schichten gearbeitet oder etwas verdient haben
  const mids = [...new Set(sch.flatMap(s => [...s.mas, ...s.buch.filter(b => b.masseur).map(b => b.masseur)]))];
  if (U.fuer !== 'ges' && U.fuer !== 'alle' && !mids.includes(U.fuer)) U.fuer = 'ges';
  const fuer = [['ges', 'Abrechnung Sauna'], ['alle', 'Abrechnung Massage – alle Masseure (je eine Seite)'], ...mids.map(m => [m, 'Abrechnung Massage – ' + name('mas', m)])];
  return `<div class="row noprint"><select id="abr-sel" data-act="abrWahl">${opt.map(([v, l]) => `<option value="${v}" ${v === U.abr ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <select id="abr-fuer" data-act="abrFuer">${fuer.map(([v, l]) => `<option value="${v}" ${v === U.fuer ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
    <button class="p" onclick="window.print()">🖨 Drucken</button></div>` +
    (U.fuer === 'ges' ? abrechnung(sch) : U.fuer === 'alle' ? (mids.map(m => masseurAbrechnung(sch, m)).join('') || '<div class="card mut">Keine Masseure in dieser Auswahl.</div>') : masseurAbrechnung(sch, U.fuer));
}

// Getrennte Abrechnung je Masseur: seine Massagen, sein Trinkgeld-Anteil, Summe zum Auszahlen.
// Mail über mailto: – öffnet das Mailprogramm des Geräts mit fertigem Text; ein Anhang ist so nicht
// möglich, deshalb steht die Abrechnung im Text. Kein Server nötig, es verlässt nichts das Gerät.
// Warum kein <button> im <a>: verschachtelte Bedienelemente öffnen auf Tablets und in Firefox
// oft das Mailprogramm nicht. Der Link ist selbst als Knopf gestaltet. Die Adresse bleibt
// unkodiert (@ und , verstehen nicht alle Mailprogramme in kodierter Form), Zeilenumbrüche
// als CRLF, wie mailto: es verlangt.
const MT = {}; // Mailtexte für „Text kopieren“, nach Schlüssel
function mailKnopf(namen, adressen, betreff, text) {
  const ad = [...new Set(adressen.filter(Boolean))];
  if (!ad.length) return `<span class="mut noprint">✉ Keine E-Mail-Adresse hinterlegt (Stammdaten → ${namen}). Ist der Name dort doppelt angelegt? Dann den Eintrag ohne Adresse entfernen.</span>`;
  const body = encodeURIComponent(text.replace(/\n/g, '\r\n')), su = encodeURIComponent(betreff), an = ad.join(',');
  const k = id(); MT[k] = text;
  const css = 'display:inline-block;padding:8px 12px;border-radius:6px;text-decoration:none;border:1px solid var(--acc);';
  return `<a class="noprint" style="${css}background:var(--acc);color:#fff" href="mailto:${an}?subject=${su}&body=${body}">✉ E-Mail an ${esc(an)}</a>
    <a class="noprint" style="${css}color:var(--acc)" target="_blank" rel="noopener" href="https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(an)}&su=${su}&body=${body}">in Gmail öffnen</a>
    <button class="noprint" type="button" data-act="kopiere" data-v="${k}">Text kopieren</button>`;
}
// Kontakt über die Person suchen, nicht nur über die ID: wer „Robert“ zweimal angelegt hat (einmal
// vor den Kontaktfeldern, einmal mit), sonst findet die Schicht nur den alten Satz ohne Mail.
function kontakt(liste, i) {
  const m = S[liste].find(x => x.id === i) || {};
  if (m.email) return m;
  const gleich = S[liste].find(x => x.email && (x.name || '').trim().toLowerCase() === (m.name || '').trim().toLowerCase());
  return gleich ? { ...m, email: gleich.email, tel: m.tel || gleich.tel, adresse: m.adresse || gleich.adresse } : m;
}
function masseurDaten(sch, mid) {
  const summe = (a, f) => a.reduce((x, y) => x + f(y), 0);
  const bu = sch.flatMap(s => s.buch.filter(b => b.masseur === mid && !b.uebernommen).map(b => ({ ...b, s })));
  const tr = sch.flatMap(s => s.zahl.flatMap(z => tipVerteilung(s, z).filter(x => x.an === 'm:' + mid).map(x => ({ s, z, betrag: x.betrag }))));
  return { bu, tr, um: summe(bu, b => b.menge * b.preis), ti: summe(tr, t => t.betrag), mi: summe(bu, miete) };
}
function masseurText(sch, mid) {
  const d = masseurDaten(sch, mid), nm = name('mas', mid);
  const gastText = (s, id) => { const g = s.gaeste.find(x => x.id === id); return g ? kundeText(g) : '?'; };
  return `Abrechnung ${nm} – ${datumDe(sch[0].datum)}\n\nMassagen:\n` +
    (d.bu.map(b => `  ${schName(b.s.nr)}, ${b.zeit}, Schlüssel ${gastText(b.s, b.gast)}: ${b.name} ${eur(b.menge * b.preis)}`).join('\n') || '  keine') +
    `\nUmsatz Massagen: ${eur(d.um)}\n\nTrinkgeld:\n` +
    (d.tr.map(t => `  ${schName(t.s.nr)}, ${t.z.zeit}, Schlüssel ${gastText(t.s, t.z.gast)} (${t.z.art}): ${eur(t.betrag)}`).join('\n') || '  keins') +
    `\nTrinkgeld gesamt: ${eur(d.ti)}\n\nVermerk: Miete ${MIETE_PROZENT} % vom Massagepreis (ohne Trinkgeld) auf ${eur(d.um)} = ${eur(d.mi)}.\nDie Miete wird zu einem späteren Zeitpunkt per Rechnung bezahlt und hier nicht abgezogen.\n`;
}
// Die Abrechnung ist zweigeteilt: „Sauna“ enthält alles außer den Massagen, „Massage“ ist die Abrechnung je Masseur
// (masseurAbrechnung, unverändert). Sauna: keine Massage-Buchungen, keine Massage-Zahlungen (kat „massage“) und vom
// Trinkgeld nur, was nicht an Masseure geht – das steht in deren Abrechnung. Zahlungen ohne kat (früher gebucht) und
// Sonstiges Trinkgeld bleiben in der Sauna-Abrechnung. Unten stehen die Massagen mit der Miete, die in Rechnung zu stellen ist.
function saunaDaten(sch) {
  const summe = (a, f) => a.reduce((x, y) => x + f(y), 0);
  const buch = sch.flatMap(s => s.buch.filter(b => !b.uebernommen).map(b => ({ ...b, s })));
  const sbu = buch.filter(b => !b.masseur), mbu = buch.filter(b => b.masseur);
  const nichtM = x => !String(x.an).startsWith('m:');
  const zahl = sch.flatMap(s => s.zahl.filter(z => !z.uebernommen && z.kat !== 'massage').map(z => ({ ...z, s })))
    .map(z => ({ ...z, tipS: summe(tipVerteilung(z.s, z).filter(nichtM), x => x.betrag) }));
  const tv = zahl.flatMap(z => tipVerteilung(z.s, z).filter(nichtM));
  const mids = [...new Set(mbu.map(b => b.masseur))];
  const mieteJe = mids.map(m => ({ m, bu: mbu.filter(b => b.masseur === m) }))
    .map(x => ({ ...x, anz: summe(x.bu, b => b.menge), preis: summe(x.bu, b => b.menge * b.preis), miete: summe(x.bu, miete) }));
  return { summe, buch, sbu, mbu, zahl, tv, mids, mieteJe, saunaU: summe(sbu, b => b.menge * b.preis), mieteU: summe(mbu, miete) };
}
function gesamtText(sch) {
  const d = saunaDaten(sch), { summe, zahl, tv, saunaU, mieteU, mieteJe } = d;
  return `Abrechnung Sauna ${datumDe(sch[0].datum)} (${sch.map(s => schName(s.nr)).join(', ')})\n\nEinnahmen nach Zahlungsart:\n` +
    [...new Set(zahl.map(z => z.art))].map(a => { const z = zahl.filter(x => x.art === a); return `  ${a}: ${eur(summe(z, x => x.betrag))} + Trinkgeld ${eur(summe(z, x => x.tipS))}`; }).join('\n') +
    `\nGesamt: ${eur(summe(zahl, x => x.betrag))} + Trinkgeld ${eur(summe(zahl, x => x.tipS))}\nUmsatz Leistungen und Waren: ${eur(saunaU)}\n\nTrinkgeld je Empfänger:\n` +
    ([...new Set(tv.map(x => x.an))].map(e => `  ${empfName(e)}: ${eur(summe(tv.filter(x => x.an === e), x => x.betrag))}`).join('\n') || '  keins') +
    `\n\nMassagen – Miete ${MIETE_PROZENT} % vom Preis (ohne Trinkgeld):\n` +
    (mieteJe.map(x => `  ${name('mas', x.m)}: ${x.anz} Massage(n), ${eur(x.preis)} → Miete ${eur(x.miete)}`).join('\n') || '  keine') +
    `\nIn Rechnung zu stellen: ${eur(mieteU)}\n`;
}
function masseurAbrechnung(sch, mid) {
  const summe = (a, f) => a.reduce((x, y) => x + f(y), 0);
  const gastText = (s, id) => { const g = s.gaeste.find(x => x.id === id); return g ? kundeText(g) : '?'; };
  const { bu, tr, um, ti, mi } = masseurDaten(sch, mid);
  const m = kontakt('mas', mid);
  return `<div class="card seite"><h2>Abrechnung Masseur ${esc(name('mas', mid))} – ${datumDe(sch[0].datum)}</h2>
  <div class="mut">${sch.map(s => schName(s.nr)).join(' · ')}${m.email ? ' · ' + esc(m.email) : ''}${m.tel ? ' · ☎ ' + esc(m.tel) : ''}${m.adresse ? ' · 🏠 ' + esc(m.adresse) : ''}</div>
  <div class="row">${mailKnopf('Masseur*innen', [m.email], 'Abrechnung ' + name('mas', mid) + ' ' + datumDe(sch[0].datum), masseurText(sch, mid))}</div>
  <h3>Massagen</h3>` + (bu.length ? `<table><tr><th>Schicht</th><th>Zeit</th><th>Schlüssel</th><th>Massage</th><th class="r">Preis</th></tr>
  ${bu.map(b => `<tr><td>${schName(b.s.nr)}</td><td>${b.zeit}</td><td>${esc(gastText(b.s, b.gast))}</td><td>${b.menge > 1 ? b.menge + '× ' : ''}${esc(b.name)}</td><td class="r">${eur(b.menge * b.preis)}</td></tr>`).join('')}
  <tr><th colspan="4">${summe(bu, b => b.menge)} Massage(n), Umsatz</th><th class="r">${eur(um)}</th></tr></table>` : '<span class="mut">Keine Massagen.</span>') + `
  <h3>Trinkgeld</h3>` + (tr.length ? `<table><tr><th>Schicht</th><th>Zeit</th><th>Schlüssel</th><th>Art</th><th class="r">Betrag</th></tr>
  ${tr.map(t => `<tr><td>${schName(t.s.nr)}</td><td>${t.z.zeit}</td><td>${esc(gastText(t.s, t.z.gast))}</td><td>${esc(t.z.art)}</td><td class="r">${eur(t.betrag)}</td></tr>`).join('')}
  <tr><th colspan="4">Trinkgeld gesamt</th><th class="r">${eur(ti)}</th></tr></table>` : '<span class="mut">Kein Trinkgeld.</span>') + `
  <h3>Summe</h3><table><tr><td>Umsatz Massagen</td><td class="r">${eur(um)}</td></tr><tr><td>Trinkgeld</td><td class="r">${eur(ti)}</td></tr></table>
  <p style="margin-top:28px">Trinkgeld erhalten: ______________________ (Unterschrift)</p>
  <div class="vermerk"><b>Vermerk:</b> Miete ${MIETE_PROZENT} % vom Massagepreis (ohne Trinkgeld) auf ${eur(um)} Umsatz = <b>${eur(mi)}</b>.
  Die Miete wird zu einem späteren Zeitpunkt per Rechnung bezahlt und von dieser Abrechnung nicht abgezogen.</div></div>`;
}

function abrechnung(sch) {
  // Übernommene Buchungen/Zahlungen sind schon in der Schicht abgerechnet, aus der sie kommen.
  const d = saunaDaten(sch), { summe, sbu, zahl, tv, mids, mieteJe, saunaU, mieteU } = d;
  const kopf = sch.map(s => `${schName(s.nr)} (${esc(name('ma', s.ma))}${s.zu ? '' : ', noch offen'})`).join(' · ');
  const arten = [...new Set(zahl.map(z => z.art))];
  const mas_ = [...new Set(sch.map(s => s.ma))].map(i => kontakt('ma', i));
  const alt = zahl.some(z => !z.kat && !z.extra);
  let h = `<div class="card"><h2>Abrechnung Sauna ${datumDe(sch[0].datum)}</h2><div class="mut">${kopf}</div>
  <div class="row">${mailKnopf('Mitarbeiter*innen', mas_.map(m => m.email), 'Abrechnung Sauna ' + datumDe(sch[0].datum), gesamtText(sch))}</div>
  <h3>Einnahmen nach Zahlungsart</h3><table><tr><th>Art</th><th class="r">Rechnung</th><th class="r">Trinkgeld</th><th class="r">Eingenommen</th></tr>
  ${arten.map(a => { const z = zahl.filter(x => x.art === a); const b = summe(z, x => x.betrag), t = summe(z, x => x.tipS); return `<tr><td>${esc(a)}</td><td class="r">${eur(b)}</td><td class="r">${eur(t)}</td><td class="r">${eur(b + t)}</td></tr>`; }).join('')}
  <tr><th>Gesamt</th><th class="r">${eur(summe(zahl, x => x.betrag))}</th><th class="r">${eur(summe(zahl, x => x.tipS))}</th><th class="r">${eur(summe(zahl, x => x.betrag + x.tipS))}</th></tr></table>
  ${alt ? '<div class="mut" style="margin-top:6px">Enthält früher gebuchte Zahlungen ohne Zuordnung zu Sauna oder Massage.</div>' : ''}</div>`;

  // Umsatz je Position – ohne Massagen
  const pos = {};
  sbu.forEach(b => { const k = b.name; (pos[k] = pos[k] || { m: 0, u: 0 }); pos[k].m += b.menge; pos[k].u += b.menge * b.preis; });
  h += `<div class="card"><h3>Umsatz je Leistung / Ware</h3><table><tr><th>Position</th><th class="r">Menge</th><th class="r">Umsatz</th></tr>
  ${Object.entries(pos).map(([n, v]) => `<tr><td>${esc(n)}</td><td class="r">${v.m}</td><td class="r">${eur(v.u)}</td></tr>`).join('') || '<tr><td class="mut" colspan="3">Keine Leistungen oder Waren.</td></tr>'}
  <tr><th>Gesamt</th><th></th><th class="r">${eur(saunaU)}</th></tr></table></div>`;

  // Trinkgeld je Empfänger – ohne das der Masseure
  const te = [...new Set(tv.map(x => x.an))];
  h += `<div class="card"><h3>Trinkgeld je Empfänger</h3>` + (te.length ? `<table>${te.map(e => `<tr><td>${esc(empfName(e))}</td><td class="r">${eur(summe(tv.filter(x => x.an === e), x => x.betrag))}</td></tr>`).join('')}</table>` : '<span class="mut">Kein Trinkgeld.</span>') + `</div>`;

  // Kunden-Detail + offene Beträge (nur Sauna)
  h += `<div class="card"><h3>Kunden (Schlüssel)</h3><table><tr><th>Schlüssel</th><th>Schicht</th><th>Zeit</th><th class="r">Gebucht</th><th class="r">Bezahlt</th><th class="r">Trinkgeld</th><th class="r">Offen</th></tr>
  ${sch.flatMap(s => s.gaeste.map(x => {
    const bu = s.buch.filter(b => b.gast === x.id && !b.masseur && !b.uebernommen), za = zahl.filter(z => z.s.id === s.id && z.gast === x.id), off = offenKat(s, x.id).sauna;
    return `<tr><td>${esc(kundeText(x))}${x.von ? ' <span class="mut">(übernommen)</span>' : ''}</td><td>${schName(s.nr)}</td><td>${x.an || ''}${x.ab ? '–' + x.ab : ''}</td><td class="r">${eur(summe(bu, b => b.menge * b.preis))}</td><td class="r">${eur(summe(za, z => z.betrag))}</td><td class="r">${eur(summe(za, z => z.tipS))}</td><td class="r ${off ? 'warn' : ''}">${eur(off)}</td></tr>`;
  })).join('')}</table>
  <div class="mut" style="margin-top:6px">Offene Beträge oben rot markiert – sie sind noch nicht bezahlt. Die Massagen stehen in der Abrechnung Massage.</div></div>`;

  // Unten: die Massagen mit der Miete, die in Rechnung zu stellen ist
  h += `<div class="card"><h3>Massagen – Miete (${MIETE_PROZENT} % vom Preis, ohne Trinkgeld)</h3>` + (mids.length ? `<table><tr><th>Masseur</th><th>Massage</th><th class="r">Anzahl</th><th class="r">Preis</th><th class="r">Miete</th></tr>` +
    mieteJe.map(x => {
      const ns = [...new Set(x.bu.map(b => b.name))];
      return ns.map((n, i) => { const y = x.bu.filter(b => b.name === n); return `<tr><td>${i ? '' : esc(name('mas', x.m))}</td><td>${esc(n)}</td><td class="r">${summe(y, b => b.menge)}</td><td class="r">${eur(summe(y, b => b.menge * b.preis))}</td><td class="r">${eur(summe(y, miete))}</td></tr>`; }).join('') +
        `<tr><td></td><th>Summe ${esc(name('mas', x.m))}</th><th class="r">${x.anz}</th><th class="r">${eur(x.preis)}</th><th class="r">${eur(x.miete)}</th></tr>`;
    }).join('') + `<tr><th colspan="4">In Rechnung zu stellen:</th><th class="r">${eur(mieteU)}</th></tr></table>` : '<span class="mut">Keine Massagen, keine Miete.</span>') +
    `<div class="mut" style="margin-top:6px">Die Masseure verkaufen die Massagen selbst; die Miete wird ihnen später per Rechnung berechnet.</div></div>`;
  return h;
}

/* ---------- Stammdaten ---------- */

const STAMM = [

  { id: 'srv', k: 'lei', t: 'Services', f: [['name', 'Bezeichnung'], ['preis', 'Preis €']], filter: x => !x.massage, set: { massage: false } },
  { id: 'mss', k: 'lei', t: 'Massagen', f: [['name', 'Bezeichnung'], ['preis', 'Preis €']], filter: x => !!x.massage, set: { massage: true } },

      ${x.email ? `<div class="mut">✉ ${esc(x.email)}</div>` : ''}${x.tel ? `<div class="mut">☎ ${esc(x.tel)}</div>` : ''}${x.adresse ? `<div class="mut">🏠 ${esc(x.adresse)}</div>` : ''}</td>
    <td class="r">${x.preis != null ? eur(x.preis) : ''}</td>
    <td class="r"><button data-act="aendern" data-g="${g.id}" data-v="${x.id}">ändern</button> <button class="x" data-act="weg" data-k="${g.k}" data-v="${x.id}">✕</button></td></tr>`).join('') || '<tr><td class="mut">Noch leer.</td></tr>'}</table>
  <div class="row">${g.f.map(([f, l]) => `<input id="s-${g.id}-${f}" placeholder="${l}" ${FELDTYP[f] || ''}>`).join('')}

    (U.symZiel ? vSymbole(U.symZiel === 'edit' ? U.editIcon : U.neuIcon[U.symZiel.slice(4)] || '') : '');
}

/* ---------- Aktionen ---------- */
function gastAufnehmen(s, k) {
  const b = belegt(k.id);
  if (b) return alert(`Schlüssel ${k.nummer} ist noch vergeben (${schName(b.s.nr)}). Erst bei dem Gast „Gast geht“ drücken.`);
  const g = { id: id(), kun: k.id, name: $v('g-name').trim(), da: true, an: uhr(), ts: Date.now(), ab: '' };
  s.gaeste.push(g); U.gast = g.id; U.gastZu = false; U.extra = false; U.neu = false;
}
const A = {
  tab: v => { U.tab = v; },
  stab: v => { U.st = v; U.edit = null; },
  gAn: () => {
    const c = GOOGLE_CLIENT_ID || $v('g-cid').trim();
    if (!c) return alert('Bitte die Google-Client-ID eintragen (Anleitung steht darunter).');
    G.cid = c; lsSet('sk-gcid', c); G.an = true; lsSet('sk-gsync', '1'); gStatus('sync'); gSync(true);
  },
  gAus: () => { if (confirm('Google-Abgleich auf diesem Gerät ausschalten? Die Daten hier bleiben erhalten.')) { G.an = false; G.tok = ''; lsSet('sk-gsync', '0'); gStatus('aus'); } },
  gJetzt: () => { gSync(false); return false; },
  gLogin: () => { gSync(true); return false; },
  kopiere: v => {
    const t = MT[v];
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => alert('Text kopiert – jetzt in eine Mail einfügen.'), () => prompt('Zum Kopieren Strg+C drücken:', t));
    return false;
  },
  schicht: v => { U.sch = v; U.gast = null; U.form = null; U.neu = false; },
  // Die freien Schlüssel stehen nicht mehr dauerhaft auf der Startseite, sondern erst nach „Neuer Gast“.
  neuGast: () => { U.neu = true; },
  neuAb: () => { U.neu = false; },
  gast: v => { U.gast = v; U.gastZu = false; },
  // Die Leiste im Kopf: Auswahl öffnet/schließt die Liste; jede andere Aktion schließt sie (siehe Klick-Behandlung unten).
  pop: v => { U.pop = U.pop === v ? null : v; },
  gastTop: (v, el) => { U.gast = v; if (el && el.dataset.sch) U.sch = el.dataset.sch; U.gastZu = false; U.extra = false; U.tab = 'kasse'; U.form = null; },
  neuGastTop: () => { U.tab = 'kasse'; U.neu = true; U.form = null; },
  schTop: v => { U.sch = v; U.gast = null; U.gastZu = false; U.extra = false; U.form = null; U.neu = false; U.tab = 'kasse'; },
  masWahl: v => { U.mas = v; behalte(); if (U.keep) delete U.keep['p-m-betrag']; },   // Vorbelegung gehört zum Masseur
  artWahl: v => { U.art = v; behalte(); },
  extraSchalter: () => { U.extra = !U.extra; U.extraSel = []; },
  extraWahl: v => { U.extraSel = U.extraSel.includes(v) ? U.extraSel.filter(x => x !== v) : [...U.extraSel, v]; behalte(); },
  // Sonstiges Trinkgeld ist eine Zahlung ohne Rechnungsbetrag: eine freie Summe, gleichmäßig auf die Angewählten
  // (tipAn 'multi', Empfänger in empf; die Rechnung steht in tipVerteilung).
  extraBuchen: () => {
    const s = schicht(); if (!s || !U.gast) return false;
    const tip = cent($v('x-betrag'));
    if (tip <= 0) { alert('Bitte einen Betrag eingeben.'); return false; }
    if (!U.extraSel.length) { alert('Bitte mindestens einen Mitarbeiter oder Masseur anwählen.'); return false; }
    s.zahl.push({ id: id(), ma: s.ma, gast: U.gast, betrag: 0, tip, art: U.art, tipAn: 'multi', empf: [...U.extraSel], extra: true, zeit: uhr() });
    U.extra = false; U.extraSel = [];
  },
  // Ohne Neuzeichnen: nur das Feld füllen, damit nichts verspringt.
  // Prozent vom Betrag dieses Blocks (bei Teilzahlung also vom Teilbetrag); ist das Feld leer, vom Gebuchten der Gruppe
  // (Sauna: Leistungen und Waren; Massage: die Massagen des gewählten Masseurs).
  tipProz: (v, el) => {
    const b = el.dataset.b, s = schicht(), ok = offenKat(s, U.gast);
    const basis = cent($v(`p-${b}-betrag`)) || (b === 's' ? ok.saunaGebucht : ok.massageJe(U.mas));
    $(`p-${b}-tip`).value = (Math.round(basis * v / 100) / 100).toFixed(2).replace('.', ',');
    $(`p-${b}-hint`).textContent = `${v} % von ${eur(basis)}`;
    kartenAnzeigen();
    return false;
  },
  tipLeer: (_, el) => { const b = el.dataset.b; $(`p-${b}-tip`).value = ''; $(`p-${b}-hint`).textContent = 'Kein Trinkgeld.'; kartenAnzeigen(); return false; },
  restSetzen: (v, el) => { $(`p-${el.dataset.b}-betrag`).value = (v / 100).toFixed(2).replace('.', ','); kartenAnzeigen(); return false; },
  abrWahl: () => { U.abr = $v('abr-sel'); },
  abrFuer: () => { U.fuer = $v('abr-fuer'); },
  oeffnen: () => {
    const datum = $v('o-datum'), nr = +$v('o-nr');
    if (!datum) { alert('Bitte ein Datum wählen.'); return false; }
    if (S.sch.some(s => s.datum === datum && s.nr === nr)) { alert(`Die ${schName(nr)} wurde am ${datumDe(datum)} schon geöffnet.`); return false; }
    const mas = [...document.querySelectorAll('input[name=o-mas]:checked')].map(c => c.value);
    const s = { id: id(), datum, nr, ma: $v('o-ma'), mas, gaeste: [], buch: [], zahl: [], zu: false };
    S.sch.push(s); U.sch = s.id; U.gast = null; U.gastZu = false; U.oeffnen = false;
  },
  oeffnenForm: () => { U.oeffnen = true; U.tab = 'kasse'; U.form = null; },
  oeffnenAb: () => { U.oeffnen = false; },
  wechselForm: () => { U.form = 'wechsel'; U.tab = 'kasse'; },
  bearbForm: () => { U.form = 'bearb'; U.tab = 'kasse'; },
  formAb: () => { U.form = null; },
  bearbOk: () => {
    const s = schicht(); if (!s) return;
    if (!$v('w-ma')) return alert('Bitte eine Mitarbeiterin / einen Mitarbeiter wählen.');
    s.ma = $v('w-ma'); s.mas = [...document.querySelectorAll('input[name=w-mas]:checked')].map(c => c.value); U.form = null;
  },
  // Wechsel: Gäste, die noch da sind, ziehen mit Schlüssel, Ankunftszeit und Buchungen in die Abendschicht um.
  // Die Kopien tragen „uebernommen“, damit Umsatz und Einnahmen nur einmal zählen (in der Tagesschicht).
  wechselOk: () => {
    const alt = schicht(); if (!alt) return;
    if (!$v('w-ma')) return alert('Bitte eine Mitarbeiterin / einen Mitarbeiter für die Abendschicht wählen.');
    if (S.sch.some(x => x.datum === alt.datum && x.nr === 2)) return alert('Für diesen Tag gibt es die Abendschicht schon.');
    const neu = { id: id(), datum: alt.datum, nr: 2, ma: $v('w-ma'), mas: [...document.querySelectorAll('input[name=w-mas]:checked')].map(c => c.value), gaeste: [], buch: [], zahl: [], zu: false };
    const jetzt = uhr();
    alt.gaeste.filter(g => g.da).forEach(g => {
      const ng = { id: id(), kun: g.kun, name: g.name, da: true, an: g.an, ts: g.ts, ab: '', von: g.id };
      neu.gaeste.push(ng);
      alt.buch.filter(b => b.gast === g.id).forEach(b => neu.buch.push({ ...b, id: id(), gast: ng.id, uebernommen: true }));
      alt.zahl.filter(z => z.gast === g.id).forEach(z => neu.zahl.push({ ...z, id: id(), gast: ng.id, tip: 0, tipAn: '', uebernommen: true }));
      g.da = false; g.ab = jetzt;
    });
    alt.zu = true; S.sch.push(neu); U.sch = neu.id; U.gast = null; U.gastZu = false; U.form = null;
  },
  schliessen: () => {
    const s = schicht(); if (!s) return;
    const off = s.gaeste.filter(k => gastSumme(s, k.id).offen > 0).length;
    if (!confirm(off ? `${off} Kunde(n) haben noch offene Beträge. Schicht trotzdem schließen?` : 'Schicht schließen?')) return;
    s.gaeste.forEach(g => { if (g.da) { g.da = false; g.ab = uhr(); } });
    s.zu = true; U.sch = null; U.tab = 'abr'; U.abr = s.id;
  },
  gastNeu: () => {
    const s = schicht(), nr = $v('g-nr').trim(); if (!s || !nr) return;
    let k = S.kun.find(x => x.nummer === nr && !x.weg);
    if (!k) { k = { id: id(), nummer: nr, name: '' }; S.kun.push(k); }
    gastAufnehmen(s, k);
  },
  gastFrei: v => { const s = schicht(); if (s) gastAufnehmen(s, S.kun.find(x => x.id === v)); },
  geht: v => {
    const s = schicht(), g = s.gaeste.find(x => x.id === v);
    vlFuerGast(s, g, vlItem());   // die zuletzt angebrochene Stunde zählt noch, bevor der Gast geht
    const o = gastSumme(s, v).offen;
    if (o > 0 && !confirm(`Es sind noch ${eur(o)} offen. Gast trotzdem gehen lassen?`)) return;
    g.da = false; g.ab = uhr();
    // Ohne offenen Betrag ist beim Gast nichts mehr zu tun: seine Seite schließt sich, bis ein Gast gewählt wird.
    // Bei offenem Betrag (trotzdem gehen lassen) bleibt sie stehen, damit man es noch sieht.
    U.extra = false;
    if (o <= 0) { U.gastZu = true; U.gast = null; }
  },
  zurueck: v => {
    const s = schicht(), g = s.gaeste.find(x => x.id === v), b = belegt(g.kun);
    if (b) return alert('Dieser Schlüssel ist inzwischen an jemand anderen vergeben.');
    g.da = true; g.ab = '';
  },
  buche: (v, el) => {
    const s = schicht(); if (!s || !U.gast) return;
    const l = S[el.dataset.k].find(x => x.id === v);
    let masseur = '';
    if (l.massage) { masseur = U.mas; if (!masseur) return alert('Bitte oben in der Zeile einen Masseur antippen. Ohne Masseure in der Schicht: Schicht bearbeiten.'); }
    // Gleicher Artikel beim selben Gast (und gleichem Masseur) erhöht die Menge, statt eine weitere Zeile anzulegen.
    // Aus der Vorschicht Übernommenes bleibt unberührt, es ist dort schon abgerechnet.
    const da = s.buch.find(b => b.gast === U.gast && !b.uebernommen && !b.auto && b.name === l.name && b.preis === l.preis && (b.masseur || '') === masseur);
    if (da) da.menge += 1;
    else s.buch.push({ id: id(), gast: U.gast, name: l.name, preis: l.preis, menge: 1, masseur, zeit: uhr() });
  },
  // Bei Menge > 1 nimmt ✕ eine Einheit weg, sonst die Zeile.
  buchWeg: v => {
    const s = schicht(), b = s.buch.find(x => x.id === v); if (!b) return;
    if (!confirm(b.menge > 1 ? `Eine Einheit „${b.name}“ entfernen?` : 'Buchung löschen?')) return;
    if (b.auto && !b.uebernommen) { const g = s.gaeste.find(x => x.id === b.gast); if (g) g.vlAbzug = (g.vlAbzug || 0) + 1; }
    if (b.menge > 1) b.menge -= 1; else s.buch = s.buch.filter(x => x.id !== v);
  },
  // Sauna: Trinkgeld an den Mitarbeiter an der Kasse. Massage: Trinkgeld an den gewählten Masseur. Anteilig verteilt wird
  // bei neuen Zahlungen nicht mehr (tipVerteilung kennt „auto“ nur noch für früher gebuchte).
  zahleS: () => zahleBlock('s'),
  zahleM: () => zahleBlock('m'),
  zahlWeg: v => { const s = schicht(); if (confirm('Zahlung löschen?')) s.zahl = s.zahl.filter(z => z.id !== v); },
  neu: (_, el) => {
    const g = STAMM.find(x => x.id === el.dataset.g), o = { id: id(), ...(g.set || {}) };
    for (const [f] of g.f) { const e = $(`s-${g.id}-${f}`); o[f] = f === 'preis' ? cent(e.value) : e.value.trim(); }
    if (!(o.name || o.nummer)) return alert('Bitte einen Namen bzw. eine Nummer eingeben.');
    if (g.k === 'kun' && S.kun.some(k => k.nummer === o.nummer && !k.weg)) return alert('Diese Schlüsselnummer gibt es schon.');
    if ((g.k === 'lei' || g.k === 'war') && U.neuIcon[g.id]) o.icon = U.neuIcon[g.id];
    S[g.k].push(o); U.neuIcon[g.id] = '';
  },
  // Warum nur ausblenden statt löschen: alte Abrechnungen verweisen auf die Person/Position.
  weg: (v, el) => { if (confirm('Eintrag entfernen? Alte Abrechnungen bleiben erhalten.')) S[el.dataset.k].find(x => x.id === v).weg = true; },
  // Bearbeiten direkt in der Zeile: eine Kette von prompt()-Fenstern ist am Tablet mühsam.
  aendern: v => { U.edit = v; const x = ['lei', 'war'].map(k => S[k].find(y => y.id === v)).find(Boolean); U.editIcon = (x && x.icon) || ''; },
  aendAb: () => { U.edit = null; },
  aendSave: (v, el) => {
    const g = STAMM.find(x => x.id === el.dataset.g), o = S[g.k].find(x => x.id === v);
    for (const [f] of g.f) { const e = $('e-' + f); o[f] = f === 'preis' ? cent(e.value) : e.value.trim(); }
    if (g.k === 'lei' || g.k === 'war') { if (U.editIcon) o.icon = U.editIcon; else delete o.icon; }
    U.edit = null; U.editIcon = '';
  },
  // Symbol-Auswahl in den Stammdaten; angefangene Eingaben bleiben stehen (behalte).
  symOeffnen: (v, el) => { U.symZiel = el.dataset.ziel; behalte(); },
  symWahl: v => {
    const z = U.symZiel;
    if (z === 'edit') U.editIcon = v; else if (z && z.startsWith('neu:')) U.neuIcon[z.slice(4)] = v;
    U.symZiel = null; behalte();
  },
  symZu: () => { U.symZiel = null; behalte(); },
  export: () => { sicherungHerunterladen(`sauna-kasse-${heute()}.json`); return false; },
  // Alles Buchungsartige weg, die Stammdaten (Mitarbeiter, Masseure, Leistungen, Waren, Schlüssel) bleiben.
  // Warum zwei Sicherungen vor dem Löschen: ein Gerät mit eingeschaltetem Abgleich verbreitet das Löschen über
  // die Löschvermerke (S.tot, siehe stempeln) auf alle Geräte und ins Google-Konto – ohne Sicherung gäbe es
  // keinen Weg zurück. Darum lädt der Knopf sie selbst herunter, bevor er die zweite Frage stellt.
  buchungenLoeschen: () => {
    const n = { sch: S.sch.length, g: 0, b: 0, z: 0 };
    S.sch.forEach(s => { n.g += (s.gaeste || []).length; n.b += (s.buch || []).length; n.z += (s.zahl || []).length; });
    if (!n.sch) { alert('Es gibt keine Schichten, die gelöscht werden könnten.'); return false; }
    if (!confirm(`Wirklich ALLE Buchungen löschen?\n\n${n.sch} Schicht(en), ${n.g} Gast-Aufenthalte, ${n.b} Buchungen, ${n.z} Zahlungen.\n\nMitarbeiter, Masseure, Leistungen, Waren und Schlüssel bleiben.\nVorher wird eine Sicherung heruntergeladen.${G.an ? '\n\nDer Google-Abgleich ist an: das Löschen gilt beim nächsten Abgleich auf ALLEN Geräten.' : ''}`)) return false;
    sicherungHerunterladen(`sauna-kasse-VOR-DEM-LOESCHEN-${heute()}-${uhr().replace(':', '')}.json`);
    if ((prompt('Die Sicherung wurde heruntergeladen. Zum Löschen bitte das Wort LÖSCHEN eintippen:') || '').trim().toLowerCase() !== 'löschen') { alert('Nichts gelöscht.'); return false; }
    S.sch = []; U.sch = null; U.gast = null; U.abr = null; U.form = null; U.neu = false; U.pop = null; U.tab = 'kasse';
  }
};
function zahleBlock(b) {
  const s = schicht(); if (!s || !U.gast) return false;
  const betrag = cent($v(`p-${b}-betrag`)), tip = cent($v(`p-${b}-tip`));
  if (betrag <= 0 && tip <= 0) { alert('Bitte Betrag oder Trinkgeld eingeben.'); return false; }
  const z = { id: id(), ma: s.ma, gast: U.gast, betrag, tip, art: U.art, zeit: uhr() };
  if (b === 's') { z.kat = 'sauna'; z.tipAn = tip ? 'p:' + s.ma : ''; }
  else {
    if (!U.mas) { alert('Bitte oben in der Zeile einen Masseur antippen.'); return false; }
    z.kat = 'massage'; z.masseur = U.mas; z.tipAn = tip ? 'm:' + U.mas : '';
  }
  s.zahl.push(z);
}
function sicherungHerunterladen(dateiname) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }));
  a.download = dateiname; a.click();
}

document.addEventListener('click', e => {
  // Tipp außerhalb des Kopfes oder auf eine andere Aktion klappt die Liste der Leiste wieder zu.
  const el = e.target.closest('[data-act]');
  if (U.pop && (!e.target.closest('header') || (el && el.dataset.act !== 'pop'))) { U.pop = null; if (!el) render(); }
  if (!el || el.tagName === 'SELECT') return;
  if (A[el.dataset.act](el.dataset.v, el) === false) return;
  speichern(); render();
});
document.addEventListener('input', e => { if (/^p-[sm]-(betrag|tip)$/.test(e.target.id || '')) kartenAnzeigen(); });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'imp' && el.files[0]) {
    el.files[0].text().then(t => {
      try { const n = JSON.parse(t); if (n.v !== 1) throw 0; if (!confirm('Aktuelle Daten durch die Sicherung ersetzen?')) return; S = migriere(n); speichern(); render(); }
      catch (x) { alert('Das ist keine gültige Sicherung.'); }
    });
  } else if (el.tagName === 'SELECT' && el.dataset.act) { A[el.dataset.act](); render(); }
});
render();
</script>
