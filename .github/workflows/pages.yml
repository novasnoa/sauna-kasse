# Warum ein Workflow: die Kasse ist eine einzelne Datei, es gibt nichts zu bauen –
# der Workflow veröffentlicht sie nur bei jedem Push auf main über GitHub Pages.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: mkdir _site && cp index.html sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png apple-touch-icon.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
